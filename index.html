<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Célèbre ton moment, inspire le prochain. Des histoires vraies. Des gens qui s'entraident.">
<meta property="og:title" content="WeBunga">
<meta property="og:description" content="Célèbre ton moment, inspire le prochain.">
<title>WeBunga Prototype V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: app mobile une colonne ; en-tête collant (logo, recherche, groupes) ; barre de navigation fixe à 5 entrées avec Célébrer au centre */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --line:#e2e7f1; --ink:#13234a; --muted:#5d6987;
  --navy:#004fb0; --coral:#e9503a; --yellow:#fbc702; --green:#24a065; --violet:#7b4fd1;
  --coral-soft:#fde3de; --blue-soft:#dce8f8; --yellow-soft:#fff3c4; --green-soft:#dcf2e7; --violet-soft:#ece4fb;
  --on-accent:#ffffff; --logo-bg:transparent; --shadow:0 8px 24px rgba(14,30,80,.10);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1330; --surface:#161f43; --line:#27325e; --ink:#eef1fb; --muted:#a6b0cd;
  --navy:#8db8f7; --coral:#ff7a63; --yellow:#ffd23f; --green:#47c98a; --violet:#b597f5;
  --coral-soft:#3d1d17; --blue-soft:#132f5c; --yellow-soft:#3a3010; --green-soft:#12352a; --violet-soft:#2a1f4a;
  --on-accent:#1a0d0a; --logo-bg:#ffffff; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1330; --surface:#161f43; --line:#27325e; --ink:#eef1fb; --muted:#a6b0cd;
  --navy:#8db8f7; --coral:#ff7a63; --yellow:#ffd23f; --green:#47c98a; --violet:#b597f5;
  --coral-soft:#3d1d17; --blue-soft:#132f5c; --yellow-soft:#3a3010; --green-soft:#12352a; --violet-soft:#2a1f4a;
  --on-accent:#1a0d0a; --logo-bg:#ffffff; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

.app{max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:8px}
.logo{display:inline-block;background:var(--logo-bg);border-radius:10px;padding:3px 6px;line-height:0;margin-right:auto}
.logo img{height:38px;width:auto;display:block}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;position:relative}
.iconbtn.ghost{border:0;background:none}

h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:6px 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;margin:4px 0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:16px}

label.f{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
.opt{font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=search],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
textarea{min-height:84px;resize:vertical}
.err{color:var(--coral);font-size:13px;font-weight:700;margin-top:8px}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--coral);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--navy);color:var(--surface)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.on{background:var(--green);color:#fff}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:800;font-size:14px}
.back{background:none;border:0;padding:6px 0;color:var(--navy);font-weight:800;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}

.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none;background-size:cover;background-position:center;font-size:16px}
.av.xs{width:26px;height:26px;font-size:11px}
.av.sm{width:34px;height:34px;font-size:14px}
.av.lg{width:84px;height:84px;font-size:34px}
.avstack{display:flex}
.avstack .av{border:2px solid var(--surface);margin-left:-8px}
.avstack .av:first-child{margin-left:0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;width:fit-content;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.chips button.on{border-color:var(--coral);background:var(--coral-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feed{display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .meta{flex:1;min-width:0}
.who b{display:block;line-height:1.2;overflow-wrap:anywhere}
.who small{color:var(--muted);display:block}
.plain{background:none;border:0;padding:0;text-align:left;color:inherit}
.ask{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:800}
.title{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;margin:-4px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;font-weight:700}
.facts span{display:inline-flex;align-items:center;gap:5px}
.media{display:grid;gap:4px;border-radius:12px;overflow:hidden}
.media.n2{grid-template-columns:1fr 1fr}
.media.n3,.media.n4{grid-template-columns:1fr 1fr}
.media img,.media video{width:100%;max-width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3;background:var(--bg)}
.media.n1 img,.media.n1 video{aspect-ratio:auto;max-height:360px}
.placeholder-photo{aspect-ratio:16/9;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;text-align:center;padding:16px;text-wrap:balance}
.counts{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700;gap:8px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.actions button{background:none;border:0;border-radius:10px;padding:8px 2px;font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.actions button.on{color:var(--coral)}
.rx{position:relative}
.rxpick{position:absolute;bottom:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:flex;gap:2px;padding:4px;z-index:5}
.rxpick button{font-size:22px;background:none;border:0;padding:4px 6px;border-radius:50%}
.rxpick button.on{background:var(--coral-soft)}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rsvp button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:800;font-size:13px}
.rsvp button.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.rsvp button.maybe.on{background:var(--yellow-soft);border-color:var(--yellow);color:var(--ink)}
.rsvp button.no.on{background:var(--bg);border-color:var(--muted);color:var(--muted)}

.cmt{display:flex;gap:8px;align-items:flex-start}
.cmt .b{background:var(--bg);border-radius:14px;padding:8px 12px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.cmt .b b{display:block;font-size:13px}
.cmt small{color:var(--muted);font-size:11px;margin-left:12px}
.congrats{background:linear-gradient(135deg,var(--coral-soft),var(--yellow-soft));border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.congrats .b{min-width:0;overflow-wrap:anywhere;font-size:14px}
.congrats b{display:block}

.upnext{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.upnext::-webkit-scrollbar{display:none}
.upcard{flex:none;width:160px;border-radius:16px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:4px;text-align:left;border:0;min-height:112px}
.upcard .d{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.upcard b{font-family:var(--display);font-size:16px;line-height:1.15}
.upcard small{opacity:.9;font-size:12px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.list>.item:first-child{border-top:0}
.item .meta{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted)}
.item.unread{background:var(--blue-soft)}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--on-accent);font-size:11px;font-weight:800;line-height:18px;padding:0 5px;text-align:center}

.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.type{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;min-width:0}
.type .e{font-size:22px;flex:none}
.type.on{border-color:var(--coral);background:var(--coral-soft)}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--coral)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700}
.pick button.on{border-color:var(--navy);background:var(--blue-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--bg)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.addmedia{position:relative;width:84px;height:84px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:12px;text-align:center}
.addmedia input{position:absolute;inset:0;opacity:0;cursor:pointer}

.chat{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--coral);color:var(--on-accent);border-color:transparent}
.bub small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.bub .from{font-size:12px;font-weight:800;display:block;margin-bottom:2px}
.bub .shared{display:block;margin-top:6px;background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:700;border:0;text-align:left;width:100%}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px;display:flex;gap:8px}
.composer input{flex:1;min-width:0;border-radius:999px}
.typing{font-size:13px;color:var(--muted);font-style:italic;padding:2px 4px}

.profile-head{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;margin-top:8px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:11px;line-height:1.2;display:block}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:800;color:var(--muted);font-size:13px}
.seg button.on{background:var(--blue-soft);color:var(--navy)}

nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.bar .in{display:flex;width:100%;max-width:560px;align-items:flex-end}
nav.bar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0;position:relative}
nav.bar button.on{color:var(--navy)}
nav.bar .plus span.p{width:52px;height:52px;border-radius:18px;background:var(--coral);color:var(--on-accent);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(233,80,58,.35)}
nav.bar .plus{color:var(--coral)}
nav.bar .dot{top:-2px;right:calc(50% - 22px)}

.sheet{position:fixed;inset:0;background:rgba(8,14,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet .box{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.linkbox{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;user-select:all;overflow-wrap:anywhere}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-weight:700}
.check input{width:20px;height:20px;flex:none;accent-color:var(--coral)}

.push{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:60;text-align:left;color:inherit}
.push .meta{flex:1;min-width:0}
.push b{display:block}
.push .an{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--navy)}
.push small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.empty{color:var(--muted);text-align:center;padding:24px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.note{background:var(--yellow-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.welcome{padding-top:10px}
.welcome .logo{display:block;margin:10px auto 6px;width:fit-content;padding:8px 12px}
.welcome .logo img{height:auto;width:min(150px,40vw)}
.photo-pick{display:flex;align-items:center;gap:14px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  .push{animation:drop .35s ease-out}@keyframes drop{from{transform:translate(-50%,-14px)}to{transform:translate(-50%,0)}}
  .rxpick{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.9)}to{transform:none}}
}

/* ---- première impression : fête ---- */
.festive{position:relative;border-radius:14px;overflow:hidden}
.festive .placeholder-photo{aspect-ratio:16/8;border-radius:0}
.festive .placeholder-photo.big{aspect-ratio:16/9}
.festive .pe{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
.cfwrap{position:absolute;inset:0;pointer-events:none}
.cf{position:absolute;width:7px;height:12px;border-radius:2px;transform:rotate(var(--r));opacity:.95}
.ftag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:#13234a;font-weight:800;font-size:12px;border-radius:999px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.celebre{font-size:15px;line-height:1.3;color:var(--ink)}
.celcard{gap:12px}
.cheers{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--yellow-soft);border-radius:12px;padding:8px 12px;min-width:0}
.cheers b{color:var(--ink)}
.ctarow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.btn.feliciter{padding:12px 14px;font-size:15px}
.btn.feliciter.done{background:var(--green-soft);color:var(--green)}
.iconact{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconact.on{border-color:var(--coral);background:var(--coral-soft)}
.rx .rxpick{left:auto;right:0}

.ctacard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:14px;margin-bottom:16px;background:linear-gradient(135deg,var(--coral-soft),var(--yellow-soft));color:var(--ink)}
.ctacard .e{font-size:30px}
.ctacard small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.story p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.story .tip{background:var(--blue-soft);border-radius:12px;padding:10px 12px}
.story .tip p{font-weight:700;color:var(--navy)}
.storybox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.storybox summary{font-weight:800;cursor:pointer}
.intro{padding-block:8px 150px;display:flex;flex-direction:column;gap:12px}
.intro .introlog{display:block;margin:0 auto;width:fit-content;padding:6px 10px}
.intro .introlog img{height:auto;width:min(120px,34vw)}
.slogan{text-align:center;font-size:32px;margin:4px 0 0}
.slogan span{color:var(--coral)}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.exwords{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.exwords .congrats{padding:8px 10px}
.cycle{list-style:none;padding:0;margin:4px 0;display:flex;flex-direction:column;gap:10px}
.cycle li{display:flex;gap:12px;align-items:flex-start}

function readImage(file, max){ return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { let w = img.width, h = img.height; if(w > max || h > max){ const k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
    const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .72)); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(); }; img.src = url; }); }

// ---------- rendu ----------
const MAIN = ["home","discover","publish","suivis","profile"];
function render(){
  const app = $("#app");
  const vals = {}; app.querySelectorAll("input[id]:not([type=file]),textarea[id]").forEach(e => vals[e.id] = e.value);
  const act = document.activeElement, actId = act && act.id, sel = act && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
  let h;
  switch(route.name){
    case "discover": h = discoverView(); break;
    case "story": h = storyView(route.id); break;
    case "cel": h = celView(route.id); break;
    case "person": h = personView(route.id); break;
    case "publish": h = DB.me ? publishView() : homeView(); break;
    case "suivis": h = DB.me ? suivisView() : homeView(); break;
    case "profile": h = DB.me ? personView("me") : homeView(); break;
    default: h = homeView();
  }
  app.innerHTML = h;
  for(const [id, v] of Object.entries(vals)){ const e = document.getElementById(id); if(e && e.value !== v && id !== "q" && id !== "q-home") e.value = v; }
  if(actId){ const e = document.getElementById(actId); if(e){ e.focus(); if(sel && e.setSelectionRange) try { e.setSelectionRange(sel[0], sel[1]); } catch(_){} } }
  const cur = MAIN.includes(route.name) ? route.name : null;
  document.querySelectorAll("nav.bar button").forEach(b => b.classList.toggle("on", b.dataset.tab === cur));
  const n = DB.followS.map(S).filter(s => s && s.steps.length && s.steps[s.steps.length-1].at > (DB.seen[s.id]||0)).length;
  $("#nb-suivis").innerHTML = n ? `<span class="dot">${n}</span>` : "";
  $("#topbar .who-me").innerHTML = DB.me ? `<button class="plain" data-tab="profile" aria-label="Mon profil">${av("me","sm")}</button>` : `<button class="btn sm ghost" data-act="login">Se connecter</button>`;
}

// ---------- actions ----------
function doAction(a){
  if(!a) return;
  if(a.t === "congrats"){ const [k, id] = a.id.split(":"); const x = k === "cel" ? Cl(id) : S(id); if(!x.congrats.includes("me")){ x.congrats.push("me"); toast(`Vous avez félicité ${first(x.by)} 🎉`); } else { x.congrats = x.congrats.filter(y => y !== "me"); } }
  if(a.t === "follows"){ const s = S(a.id); if(followsS(a.id)) { DB.followS = DB.followS.filter(x => x !== a.id); toast("Vous ne suivez plus cette histoire"); }
    else { DB.followS.push(a.id); DB.seen[a.id] = Date.now(); toast("Vous suivez cette histoire 👣");
      if(s.next && !s.done){ const nx = s.next; delete s.next; later(7000, () => { s.steps.push({id:uid(), k:nx.k, title:nx.title, text:nx.text, at:Date.now()}); push(s.by, `Nouvelle étape : ${nx.title}`, `dans « ${s.title} »`, ["story", s.id]); }); } } }
  if(a.t === "followp"){ if(followsP(a.id)) { DB.followP = DB.followP.filter(x => x !== a.id); toast(`Vous ne suivez plus ${first(a.id)}`); } else { DB.followP.push(a.id); toast(`Vous suivez ${first(a.id)}`); } }
  if(a.t === "cmt"){ const [k, id] = a.id.split(":"); const x = k === "cel" ? Cl(id) : S(id); x.cmts.push({id:uid(), by:"me", t:a.v, at:Date.now()}); toast("Commentaire publié");
    if(x.by !== "me") later(5000, () => { x.cmts.push({id:uid(), by:x.by, t:`Merci ${first("me")}, ça me touche beaucoup !`, at:Date.now()}); push(x.by, `${first(x.by)} vous a répondu`, `« Merci, ça me touche beaucoup ! »`, [k==="cel"?"cel":"story", id]); }); }
  if(a.t === "publish"){ draft = null; stack = []; route = {name:"publish"}; }
  if(a.t === "story"){ newDraft("story"); stack = []; route = {name:"publish"}; }
  if(a.t === "cel"){ newDraft("cel"); stack = []; route = {name:"publish"}; }
  if(a.t === "go"){ route = a.route; }
  save(); render();
}

document.addEventListener("click", async e => {
  const p = e.target.closest("#push"); if(p){ p.hidden = true; const g = JSON.parse(p.dataset.go||"null"); if(g) go(g[0], g[1]); return; }
  if(e.target.id === "sheet"){ closeSheet(); return; }
  const t = e.target.closest("button"); if(!t) return; const d = t.dataset;
  if(d.tab){ if(["publish","suivis","profile"].includes(d.tab) && !DB.me){ needMe(d.tab==="publish"?"Créez votre compte pour célébrer votre moment ou raconter votre histoire.":d.tab==="suivis"?"Créez votre compte pour suivre des personnes et des histoires.":"Créez votre compte en 10 secondes.", {t:"go", route:{name:d.tab}}); return; } if(d.tab === "publish") draft = null; tab(d.tab); return; }
  if(d.go){ go(d.go, d.id); return; }
  if(d.back){ back(); return; }
  if(d.close){ closeSheet(); pending = null; return; }
  if(d.cat){ discCat = d.cat; discTab = "stories"; tab("discover"); return; }
  if(d.dcat){ discCat = d.dcat; render(); return; }
  if(d.dtab){ discTab = d.dtab; render(); return; }
  if(d.stab){ suivisTab = d.stab; render(); return; }
  if(d.act){ const a = {t: d.act === "login" ? "go" : d.act, route: route};
    if(!DB.me){ needMe(d.act==="login"?"Créez votre compte en 10 secondes.":"Créez votre compte pour célébrer votre moment ou raconter votre histoire.", a); return; } doAction(a); return; }
  if(d.congrats){ const a = {t:"congrats", id:d.congrats}; if(needMe("Créez votre compte pour féliciter et encourager.", a)) doAction(a); return; }
  if(d.follows){ const a = {t:"follows", id:d.follows}; if(needMe("Créez votre compte pour suivre cette histoire et recevoir ses nouvelles étapes.", a)) doAction(a); return; }
  if(d.followp){ const a = {t:"followp", id:d.followp}; if(needMe("Créez votre compte pour suivre cette personne.", a)) doAction(a); return; }
  if(d.cancel){ draft = null; render(); return; }
  if(d.pcat){ grab(); draft.cat = d.pcat; render(); return; }
  if(d.done){ grab(); draft.done = d.done === "1"; render(); return; }
  if(d.vis){ grab(); draft.vis = d.vis; render(); return; }
  if(d.allow){ grab(); const a = draft.allowed; a.includes(d.allow) ? a.splice(a.indexOf(d.allow),1) : a.push(d.allow); render(); return; }
  if(d.rmphoto){ grab(); draft.photo = null; render(); return; }
  if(t.id === "doPublish"){ grab(); const x = draft; const err = m => { const e2 = $("#err"); e2.textContent = m; e2.hidden = false; };
    if(!x.cat) return err("Choisissez une catégorie."); if(!x.title.trim()) return err(x.kind==="story"?"Donnez un titre à votre histoire.":"Dites ce que vous célébrez.");
    if(x.kind === "story" && !x.defi.trim()) return err("Décrivez votre défi en une phrase.");
    if(x.vis === "private" && !x.allowed.length) return err("Choisissez au moins un proche, ou rendez la publication publique.");
    const now = Date.now();
    if(x.kind === "story"){ const s = {id:"s"+uid(), by:"me", cat:x.cat, title:x.title.trim(), vis:x.vis, allowed:x.allowed, at:now, defi:x.defi.trim(), effort:x.effort.trim(), reussite:x.reussite.trim(), lecon:(x.lecon||"").trim(), done:x.done, steps:[], congrats:[], cmts:[], followers:[]};
      if(x.step.trim()) s.steps.push({id:uid(), k:"etape", title:x.step.trim(), text:"", at:now}); if(x.done) s.steps.push({id:uid(), k:"reussite", title:x.reussite.trim()||"Objectif atteint", text:"", at:now+1});
      if(x.fromCel){ s.cel = x.fromCel; Cl(x.fromCel).story = s.id; }
      DB.stories.unshift(s); draft = null; save(); stack = []; route = {name:"story", id:s.id}; render(); scrollTo(0,0); toast("Histoire publiée 📖");
      later(6000, () => { s.followers.push("u1"); push("u1", "Grace suit votre histoire", `« ${s.title} »`, ["story", s.id]); });
      later(11000, () => { s.congrats.push("u4"); s.cmts.push({id:uid(), by:"u4", t:"Merci de partager ton chemin, ça m'encourage !", at:Date.now()}); push("u4", "Nadia a commenté votre histoire", "« Merci de partager ton chemin, ça m'encourage ! »", ["story", s.id]); });
    } else { const c = {id:"c"+uid(), by:"me", cat:x.cat, title:x.title.trim(), text:x.text.trim(), photo:x.photo, vis:x.vis, allowed:x.allowed, at:now, congrats:[], cmts:[]};
      if(x.fromStory){ c.story = x.fromStory; S(x.fromStory).cel = c.id; }
      DB.cels.unshift(c); draft = null; save(); stack = []; route = {name:"cel", id:c.id}; render(); scrollTo(0,0); toast("Célébration publiée 🎉");
      const fan = x.vis === "private" ? x.allowed[0] : "u1";
      later(5000, () => { c.congrats.push(fan); push(fan, `${first(fan)} vous félicite 🎉`, `« ${c.title} »`, ["cel", c.id]); }); }
    return; }
  if(d.addstep){ stepSheet(d.addstep); return; }
  if(d.addlesson){ openSheet(`<h2>💡 Ce que j'ai appris</h2><p class="sub" style="margin:0">En une phrase : le conseil que vous auriez aimé recevoir au début.</p><input type="text" id="ls-text" maxlength="200" placeholder="Ex. : Ne reste pas seul, entoure-toi de gens qui avancent."><button class="btn blue full" data-savelesson="${d.addlesson}">Enregistrer</button><button class="btn ghost" data-close="1">Annuler</button>`); setTimeout(() => $("#ls-text").focus(), 60); return; }
  if(d.savelesson){ const v = $("#ls-text").value.trim(); if(!v) return; S(d.savelesson).lecon = v; closeSheet(); save(); render(); toast("Leçon ajoutée 💡 Merci pour ceux qui vous suivent"); return; }
  if(d.stk){ document.querySelectorAll("[data-stk]").forEach(b => b.classList.toggle("on", b === t)); return; }
  if(d.savestep){ const s = S(d.savestep), title = $("#st-title").value.trim(); if(!title){ const e2 = $("#sterr"); e2.textContent = "Donnez un titre à cette étape."; e2.hidden = false; return; }
    const k = (document.querySelector("[data-stk].on")||{}).dataset?.stk || "etape";
    s.steps.push({id:uid(), k, title, text:$("#st-text").value.trim(), at:Date.now()}); if(k === "reussite"){ s.done = true; if(!s.reussite) s.reussite = title; }
    closeSheet(); save(); render(); if(k === "reussite" && !s.lecon) setTimeout(() => document.querySelector(`[data-addlesson="${s.id}"]`)?.click(), 900); toast(k === "reussite" ? "Bravo ! Votre histoire est arrivée à la réussite 🏆" : "Étape ajoutée. Vos abonnés sont prévenus 👣"); return; }
  if(d.celfrom){ const s = S(d.celfrom); newDraft("cel", {cat:s.cat, title:s.reussite||"", vis:s.vis, allowed:[...(s.allowed||[])], fromStory:s.id}); stack = []; route = {name:"publish"}; render(); scrollTo(0,0); return; }
  if(d.storyfrom){ const c = Cl(d.storyfrom); newDraft("story", {cat:c.cat, done:true, reussite:c.title, vis:c.vis, allowed:[...(c.allowed||[])], fromCel:c.id}); stack = []; route = {name:"publish"}; render(); scrollTo(0,0); return; }
  if(d.reset){ if(t.dataset.confirm !== "1"){ t.dataset.confirm = "1"; t.textContent = "Touchez encore pour tout effacer"; return; } lsSet(STORE, null); DB = seed(); draft = null; stack = []; route = {name:"home"}; render(); scrollTo(0,0); return; }
  if(t.id === "doSignup"){ const name = $("#su-name").value.trim(); if(!name){ const e2 = $("#suerr"); e2.textContent = "Indiquez votre nom."; e2.hidden = false; return; }
    DB.me = {id:"me", name, ville:$("#su-ville").value.trim(), photo:suPhoto, color:AVC[0], bio:""}; save(); closeSheet(); toast(`Bienvenue ${name.split(" ")[0]} !`);
    const a = pending; pending = null; if(a) doAction(a); else render(); return; }
});
document.addEventListener("change", async e => {
  const id = e.target.id, f = e.target.files && e.target.files[0]; if(!f) return;
  try { if(id === "su-photo"){ suPhoto = await readImage(f, 320); const a = $("#su-av"); a.style.backgroundImage = `url('${suPhoto}')`; a.style.backgroundSize = "cover"; a.textContent = ""; }
    if(id === "p-photo"){ grab(); draft.photo = await readImage(f, 1000); render(); } } catch(_) { toast("Impossible de lire cette photo."); }
});
document.addEventListener("input", e => { if(e.target.id === "q" || e.target.id === "q-home"){ q = e.target.value; if(e.target.id === "q-home"){ discTab = "stories"; tab("discover"); setTimeout(() => { const i = $("#q"); if(i){ i.focus(); i.setSelectionRange(q.length, q.length); } }, 0); return; }
  const tmp = document.createElement("div"); tmp.innerHTML = discoverView(); const cur = $("#app"); const keep = cur.querySelector(".searchbox"); tmp.querySelector(".searchbox").replaceWith(keep); cur.innerHTML = ""; while(tmp.firstChild) cur.appendChild(tmp.firstChild); keep.querySelector("input").focus(); } });
document.addEventListener("submit", e => { e.preventDefault(); const f = e.target; if(!f.dataset.cmt) return; const i = f.querySelector("input"), v = i.value.trim(); if(!v) return;
  const a = {t:"cmt", id:f.dataset.cmt, v}; if(needMe("Créez votre compte pour commenter et encourager.", a)){ i.value = ""; doAction(a); } });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
render();

</script>
