<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="WeBunga : célébrez vos moments avec ceux qui comptent.">
<meta property="og:title" content="WeBunga">
<meta property="og:description" content="Viens célébrer avec moi sur WeBunga !">
<title>WeBunga Démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: une colonne type téléphone, bandeau de démo collant en haut, un écran à la fois */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --line:#e1e6f0;
  --ink:#14244a; --muted:#5c6884;
  --navy:#004fb0; --orange:#e9503a; --green:#2aa46b; --blue:#0063cf; --yellow:#fbc702;
  --orange-soft:#fde3de; --green-soft:#dcf2e7; --blue-soft:#dce8f8;
  --on-accent:#ffffff; --demo:#0b3a80; --on-demo:#ffffff; --logo-bg:transparent;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1430; --surface:#172044; --line:#26315c; --ink:#eef1fb; --muted:#a5afcc;
  --navy:#8db8f7; --orange:#ff7a63; --green:#45c787; --blue:#6aa8f0; --yellow:#ffd23f;
  --orange-soft:#3d1d17; --green-soft:#12352a; --blue-soft:#132f5c; --on-accent:#1a0d0a; --demo:#123f88; --on-demo:#ffffff; --logo-bg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1430; --surface:#172044; --line:#26315c; --ink:#eef1fb; --muted:#a5afcc;
  --navy:#8db8f7; --orange:#ff7a63; --green:#45c787; --blue:#6aa8f0; --yellow:#ffd23f;
  --orange-soft:#3d1d17; --green-soft:#12352a; --blue-soft:#132f5c; --on-accent:#1a0d0a; --demo:#123f88; --on-demo:#ffffff; --logo-bg:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--demo);color:var(--on-demo);padding:10px 16px}
.demo .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.demo .role{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:6px;white-space:nowrap}
.demo .role.guest{background:var(--yellow);color:#1a1a1a}
.demo .txt{flex:1;min-width:0;font-size:13px;line-height:1.35}
.demo .txt b{display:block;font-size:12px;opacity:.75;font-weight:700}
.demo button{background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.progress{height:3px;background:rgba(255,255,255,.15);margin-top:8px;border-radius:2px;max-width:520px;margin-inline:auto}
.progress i{display:block;height:100%;background:var(--yellow);border-radius:2px;transition:width .3s}
.app{max-width:520px;margin:0 auto;padding:16px 16px 48px}
.logo{display:inline-block;background:var(--logo-bg);border-radius:12px;padding:4px 8px;line-height:0}
.logo img{height:46px;width:auto;display:block}
.logo.big img{height:auto;width:min(260px,70vw)}
.logo.big{padding:10px 14px}
.logo .we{color:var(--navy)} .logo .bunga{color:var(--orange)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tag{font-size:12px;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:8px 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:4px 0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:90px;resize:vertical}
.opt{font-weight:600;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--orange);color:var(--on-accent)}
.btn.full{width:100%;padding:15px;font-size:16px}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.navy{background:var(--navy);color:var(--surface)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.err{color:var(--orange);font-size:13px;margin-top:8px;font-weight:700}
.photo-pick{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:#fff;background:var(--navy);flex:none;overflow:hidden;background-size:cover;background-position:center}
.avatar.sm{width:40px;height:40px;font-size:17px}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;line-height:1.2}
.who small{color:var(--muted)}
.ask{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);font-weight:800}
.what{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;margin:-4px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.pic{width:100%;max-width:100%;border-radius:12px;display:block}
.stats{display:flex;gap:16px;color:var(--muted);font-size:14px;font-weight:700}
.stats b{color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.quick button.on{border-color:var(--orange);background:var(--orange-soft)}
.msgs{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.msg .b{background:var(--bg);border-radius:12px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.msg .b b{display:block;font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--orange-soft);color:var(--orange);width:fit-content}
.sheet{position:fixed;inset:0;background:rgba(10,16,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet .box{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.linkbox{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;white-space:pre-wrap;user-select:all;overflow-wrap:anywhere}
.hint{background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.hint b{color:var(--navy)}
.push{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(10,20,60,.22);z-index:40}
.push .meta{flex:1;min-width:0}
.push small{color:var(--muted);display:block;font-size:12px}
.push .app-name{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--blue)}
.push .sim{font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;white-space:nowrap}
@media (prefers-reduced-motion: no-preference){.push{animation:drop .35s ease-out}@keyframes drop{from{transform:translate(-50%,-16px)}to{transform:translate(-50%,0)}}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .meta{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted)}
.status{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status.host{background:var(--blue-soft);color:var(--navy)}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.wait{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.welcome{padding-top:20px}
.steps{list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--orange-soft);color:var(--orange);font-weight:800;display:grid;place-items:center;font-size:13px}
.done{text-align:center;padding:24px 8px}
.done .big{font-family:var(--display);font-weight:800;font-size:32px;color:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.publicbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:12px;overflow:hidden}
.publicbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

</head>
<body style="margin:0">
<div class="demo">
  <div class="in">
    <span class="role" id="role">Organisateur</span>
    <div class="txt" id="demoTxt"><b>Étape 1 sur 8</b>Bienvenue</div>
    <button id="restart">Recommencer</button>
  </div>
  <div class="progress"><i id="bar" style="width:12%"></i></div>
</div>
<div class="app" id="app"></div>

<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h2>Inviter des proches</h2>
    <p class="sub" style="margin:0">Copiez le lien et envoyez-le par WhatsApp ou SMS. Vos proches verront votre célébration et pourront vous féliciter.</p>
    <div class="linkbox" id="linkText"></div>
    <button class="btn full" id="copyLink">Copier le lien d'invitation</button>
    <div class="hint"><b>Pour la démo :</b> après avoir copié le lien, découvrez ce que voit votre proche quand il l'ouvre.</div>
    <button class="btn navy full" id="toGuest">Voir ce que voit mon proche</button>
    <button class="btn ghost" id="closeSheet">Fermer</button>
  </div>
</div>
<div class="push" id="push" hidden></div>
<div class="toast" id="toast" hidden></div>

const SELF = "https://aya5898.github.io/We-Bunga/";
const AVC=["#004fb0","#e9503a","#2aa46b","#d49a00","#8a4fd1","#0f8a8a"];
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2400)}

const EXAMPLE={host:{name:"Grace Mbuyi",photo:null,color:AVC[2]},cel:{title:"J'ai obtenu ma licence en génie civil !",desc:"Cinq ans de travail, et enfin le diplôme en main. Merci à ma famille et à tous ceux qui m'ont soutenue.",photo:null}};
let S;
function fresh(){return {screen:"welcome",host:{name:"",photo:null,color:AVC[0]},cel:{title:"",desc:"",photo:null},guests:[],guestDraft:{name:"",photo:null,k:null,msg:""},code:Math.random().toString(36).slice(2,8),alerts:0,fromLink:false}}
S=lsGet("wb-demo")||fresh();
function save(){const c={...S,host:{...S.host},cel:{...S.cel}};lsSet("wb-demo",c)}

const STEPS={welcome:[1,"Bienvenue"],profile:[2,"Créer votre profil"],create:[3,"Créer votre célébration"],celebration:[4,"Inviter des proches"],
  "g-view":[5,"Le proche ouvre le lien"],"g-join":[6,"Le proche crée son profil"],"g-congrats":[7,"Le proche laisse une félicitation"],"g-done":[7,"Félicitation envoyée"],
  back:[8,"Vous recevez l'alerte"],participants:[8,"Voir les participants"]};
const GUEST=["g-view","g-join","g-congrats","g-done"];

function initial(n){return esc((n||"?").trim()[0]||"?").toUpperCase()}
function avatar(p,sm){return p.photo?`<div class="avatar ${sm?"sm":""}" style="background-image:url('${p.photo}')" role="img" aria-label="${esc(p.name)}"></div>`:`<div class="avatar ${sm?"sm":""}" style="background:${p.color}">${initial(p.name)}</div>`}
function inviteLink(){return (SELF.startsWith("http")?SELF:"https://webunga.app/c")+"#invitation"}

function celCard(opts={}){
  const c=S.cel,h=S.host,gs=S.guests;
  return `<article class="card">
    <div class="who">${avatar(h,true)}<div><b>${esc(h.name)}</b><small>${opts.guest?"vous invite à célébrer":"à l'instant"}</small></div></div>
    <div class="ask">On célèbre</div>
    <h3 class="what">${esc(c.title)}</h3>
    ${c.photo?`<img class="pic" src="${c.photo}" alt="Photo de la célébration">`:""}
    ${c.desc?`<p>${esc(c.desc)}</p>`:""}
    <div class="stats"><span><b>${gs.length+1}</b> participant${gs.length?"s":""}</span><span><b>${gs.filter(g=>g.k||g.msg).length}</b> félicitation${gs.filter(g=>g.k||g.msg).length>1?"s":""}</span></div>
    ${gs.some(g=>g.k||g.msg)?`<div class="msgs">${gs.filter(g=>g.k||g.msg).map(g=>`<div class="msg">${avatar(g,true)}<div class="b"><b>${esc(g.name)}${g.k?` · <span style="color:var(--orange)">${esc(g.k)}</span>`:""}</b>${esc(g.msg)}</div></div>`).join("")}</div>`:""}
  </article>`;
}

function photoPicker(id,cur,label,round){
  return `<label>${label} <span class="opt">(facultatif)</span></label>
  <div class="photo-pick">${round?(cur?`<div class="avatar" style="background-image:url('${cur}')"></div>`:`<div class="avatar" style="background:var(--line);color:var(--muted)">+</div>`):""}
    ${!round&&cur?`<img class="pic" src="${cur}" alt="Aperçu" style="max-height:180px;width:auto">`:""}
    <span class="filebtn btn ghost">${cur?"Changer la photo":"Ajouter une photo"}<input type="file" accept="image/*" id="${id}" aria-label="${label}"></span>
    ${cur?`<button class="btn ghost" data-rm="${id}">Retirer</button>`:""}</div>`;
}

function render(){
  const st=STEPS[S.screen]||[1,""], guest=GUEST.includes(S.screen);
  $("#role").textContent=guest?"Proche invité":"Organisateur";$("#role").className="role"+(guest?" guest":"");
  $("#demoTxt").innerHTML=`<b>Étape ${st[0]} sur 8</b>${esc(st[1])}`;
  $("#bar").style.width=(st[0]/8*100)+"%";
  const head=`<div class="top"><div class="logo"><img src="${LOGO}" alt="WeBunga"></div><div class="tag">Qu'est-ce qu'on célèbre ?</div></div>`;
  let h="";
  switch(S.screen){
  case "welcome":
    h=`<div class="welcome"><div style="text-align:center;margin:8px 0 18px"><div class="logo big"><img src="${LOGO}" alt="WeBunga"></div><div class="tag" style="margin-top:6px">Qu'est-ce qu'on célèbre ?</div></div><h1>Célébrez vos moments avec ceux qui comptent</h1>
      <p class="sub">Cette démo vous montre le parcours complet en 2 minutes, des deux côtés : vous, puis le proche que vous invitez.</p>
      <ol class="steps"><li>Vous créez votre profil et votre célébration.</li><li>Vous copiez un lien d'invitation pour WhatsApp ou SMS.</li><li>Votre proche ouvre le lien, rejoint WeBunga et vous félicite.</li><li>Vous recevez l'alerte et voyez les participants.</li></ol>
      <button class="btn full" data-go="profile">Commencer</button>
      <p class="sub" style="margin-top:14px;font-size:13px">Démo sans vraie base de données : rien n'est envoyé, tout reste sur cet appareil.</p></div>`;break;
  case "profile":
    h=`${head}<h2>Votre profil</h2><p class="sub">Juste votre nom. La photo est facultative.</p>
      <label for="p-name">Votre nom</label><input type="text" id="p-name" maxlength="40" placeholder="Ex. : Kobe" value="${esc(S.host.name)}">
      ${photoPicker("p-photo",S.host.photo,"Votre photo",true)}
      <div id="err" class="err" hidden></div>
      <div class="stack"><button class="btn full" id="saveProfile">Continuer</button></div>`;break;
  case "create":
    h=`${head}<h2>Qu'est-ce qu'on célèbre ?</h2><p class="sub">Un titre, quelques mots, et une photo si vous voulez.</p>
      <label for="c-title">Titre</label><input type="text" id="c-title" maxlength="90" placeholder="Ex. : J'ai eu mon permis de conduire !" value="${esc(S.cel.title)}">
      <label for="c-desc">Petite description <span class="opt">(facultatif)</span></label><textarea id="c-desc" maxlength="400" placeholder="Racontez ce moment en une ou deux phrases">${esc(S.cel.desc)}</textarea>
      ${photoPicker("c-photo",S.cel.photo,"Photo",false)}
      <div id="err" class="err" hidden></div>
      <div class="stack"><button class="btn full" id="publish">Publier ma célébration</button><button class="btn ghost" data-go="profile">Retour</button></div>`;break;
  case "celebration": case "back":
    h=`${head}${S.screen==="back"?`<div class="hint" style="margin-bottom:12px"><b>Vous êtes de retour côté organisateur.</b> L'alerte en haut montre la félicitation reçue.</div>`:`<div class="hint" style="margin-bottom:12px"><b>Votre célébration est publiée !</b> Invitez maintenant vos proches.</div>`}
      ${celCard()}
      <div class="stack"><button class="btn full" id="invite">Inviter des proches</button>
      <button class="btn ghost" data-go="participants">Participants (${S.guests.length+1})</button></div>`;break;
  case "participants":
    h=`${head}<h2>Participants</h2><p class="sub">Les personnes qui ont rejoint votre célébration « ${esc(S.cel.title)} ».</p>
      <div class="list">
        <div class="item">${avatar(S.host,true)}<div class="meta"><b>${esc(S.host.name)}</b><small>Vous</small></div><span class="status host">Organisateur</span></div>
        ${S.guests.map(g=>`<div class="item">${avatar(g,true)}<div class="meta"><b>${esc(g.name)}</b><small>${g.k||g.msg?`« ${esc(g.k||"")}${g.k&&g.msg?" · ":""}${esc(g.msg)} »`:"A rejoint"}</small></div><span class="status ${g.k||g.msg?"ok":"wait"}">${g.k||g.msg?"A félicité":"A rejoint"}</span></div>`).join("")}
      </div>
      ${S.guests.length?"":`<div class="hint" style="margin-top:12px">Personne n'a encore rejoint. Invitez vos proches avec le lien.</div>`}
      <div class="stack"><button class="btn full" id="invite">Inviter d'autres proches</button><button class="btn ghost" data-go="back">Retour à ma célébration</button>
      <button class="btn ghost" data-go="g-view" data-newguest="1">Simuler l'arrivée d'un autre proche</button></div>`;break;
  case "g-view":
    h=`<div class="publicbar"><span>${esc(inviteLink())}</span></div>${head}
      <p class="sub" style="margin-bottom:12px"><b style="color:var(--ink)">${esc(S.host.name)}</b> vous invite à célébrer sur WeBunga.</p>
      ${celCard({guest:true})}
      <div class="stack"><button class="btn full" data-go="g-join">Rejoindre et féliciter</button>
      <p class="sub" style="text-align:center;font-size:13px;margin:0">Gratuit · Moins d'une minute</p></div>`;break;
  case "g-join":
    h=`${head}<h2>Rejoindre la célébration</h2><p class="sub">Dites-nous juste votre nom pour féliciter ${esc(S.host.name)}.</p>
      <label for="g-name">Votre nom</label><input type="text" id="g-name" maxlength="40" placeholder="Ex. : Patrick" value="${esc(S.guestDraft.name)}">
      ${photoPicker("g-photo",S.guestDraft.photo,"Votre photo",true)}
      <div id="err" class="err" hidden></div>
      <div class="stack"><button class="btn full" id="joinBtn">Rejoindre</button><button class="btn ghost" data-go="g-view">Retour</button></div>`;break;
  case "g-congrats":
    h=`${head}<p class="sub" style="margin-bottom:12px">Bienvenue <b style="color:var(--ink)">${esc(S.guestDraft.name)}</b> ! Laissez votre félicitation.</p>
      ${celCard({guest:true})}
      <label>Votre réaction</label>
      <div class="quick">${["Bravo !","Félicitations","Fier de toi","Bien mérité"].map(k=>`<button class="${S.guestDraft.k===k?"on":""}" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <label for="g-msg">Un petit mot <span class="opt">(facultatif)</span></label>
      <textarea id="g-msg" maxlength="300" placeholder="Ex. : Je suis tellement fier de toi !">${esc(S.guestDraft.msg)}</textarea>
      <div id="err" class="err" hidden></div>
      <div class="stack"><button class="btn full" id="sendCongrats">Envoyer ma félicitation</button></div>`;break;
  case "g-done":
    const last=S.guests[S.guests.length-1]||{};
    h=`${head}<div class="done"><div class="big">Merci ${esc(last.name||"")} !</div><p class="sub">Votre félicitation a été envoyée à ${esc(S.host.name)}.</p></div>
      ${celCard({guest:true})}
      <div class="hint" style="margin-top:14px"><b>Pour la démo :</b> revenez côté organisateur pour voir l'alerte de félicitations et la liste des participants.</div>
      <div class="stack"><button class="btn navy full" data-go="back" data-alert="1">Revenir côté organisateur</button></div>`;break;
  }
  app.innerHTML=h;
}

function go(s){S.screen=s;save();render();scrollTo(0,0)}
function showErr(t){const e=$("#err");e.textContent=t;e.hidden=false}

function readPhoto(file,max){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.75))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

function grab(){const g=id=>document.getElementById(id);
  if(g("p-name"))S.host.name=g("p-name").value;
  if(g("c-title"))S.cel.title=g("c-title").value; if(g("c-desc"))S.cel.desc=g("c-desc").value;
  if(g("g-name"))S.guestDraft.name=g("g-name").value; if(g("g-msg"))S.guestDraft.msg=g("g-msg").value}

function showPush(g,simulated){const p=$("#push");
  p.innerHTML=`${avatar(g,true)}<div class="meta"><div class="app-name">WeBunga · maintenant</div><b>${esc(g.name)} vous félicite !</b><small>« ${esc(g.k||"")}${g.k&&g.msg?" · ":""}${esc(g.msg)} »</small></div>${simulated?`<span class="sim">Simulé</span>`:""}`;
  p.hidden=false;clearTimeout(p._t);p._t=setTimeout(()=>p.hidden=true,5000)}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(t.id==="restart"){S=fresh();lsSet("wb-demo",null);$("#sheet").hidden=true;$("#push").hidden=true;go("welcome");return}
  if(d.rm){grab();if(d.rm==="p-photo")S.host.photo=null;if(d.rm==="c-photo")S.cel.photo=null;if(d.rm==="g-photo")S.guestDraft.photo=null;save();render();return}
  if(d.k){grab();S.guestDraft.k=S.guestDraft.k===d.k?null:d.k;render();return}
  if(d.newguest){S.guestDraft={name:"",photo:null,k:null,msg:""}}
  if(d.go){grab();const alert=d.alert;go(d.go);
    if(alert){const g=S.guests[S.guests.length-1];if(g)setTimeout(()=>showPush(g,true),500)}
    return}
  if(t.id==="saveProfile"){grab();if(!S.host.name.trim())return showErr("Indiquez votre nom.");S.host.name=S.host.name.trim();go("create");return}
  if(t.id==="publish"){grab();if(!S.cel.title.trim())return showErr("Donnez un titre à votre célébration.");S.cel.title=S.cel.title.trim();S.cel.desc=S.cel.desc.trim();go("celebration");return}
  if(t.id==="invite"){$("#linkText").textContent=`${S.host.name} t'invite à célébrer sur WeBunga : « ${S.cel.title} »\nOuvre le lien pour féliciter :\n${inviteLink()}`;$("#sheet").hidden=false;return}
  if(t.id==="closeSheet"){$("#sheet").hidden=true;return}
  if(t.id==="copyLink"){const txt=$("#linkText").textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($("#linkText"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texte sélectionné, copiez-le")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Lien d'invitation copié !"),sel)}catch(_){sel()}return}
  if(t.id==="toGuest"){$("#sheet").hidden=true;S.guestDraft={name:"",photo:null,k:null,msg:""};go("g-view");return}
  if(t.id==="joinBtn"){grab();if(!S.guestDraft.name.trim())return showErr("Indiquez votre nom.");S.guestDraft.name=S.guestDraft.name.trim();go("g-congrats");return}
  if(t.id==="sendCongrats"){grab();if(!S.guestDraft.k&&!S.guestDraft.msg.trim())return showErr("Choisissez une réaction ou écrivez un petit mot.");
    S.guests.push({name:S.guestDraft.name,photo:S.guestDraft.photo,color:AVC[(S.guests.length+1)%AVC.length],k:S.guestDraft.k,msg:S.guestDraft.msg.trim()});
    S.guestDraft={name:"",photo:null,k:null,msg:""};go("g-done");return}
});
document.addEventListener("change",async e=>{const id=e.target.id;if(!["p-photo","c-photo","g-photo"].includes(id)||!e.target.files[0])return;grab();
  try{const d=await readPhoto(e.target.files[0],id==="c-photo"?900:300);if(id==="p-photo")S.host.photo=d;if(id==="c-photo")S.cel.photo=d;if(id==="g-photo")S.guestDraft.photo=d;save();render()}
  catch(_){toast("Impossible de lire cette photo.")}});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("#sheet").hidden=true});
$("#push").addEventListener("click",()=>{$("#push").hidden=true;if(S.screen==="back"||S.screen==="celebration")go("participants")});

// Lien d'invitation ouvert directement (#invitation) : on montre la vue du proche
if(location.hash==="#invitation"){
  if(!S.cel.title){S.host={...EXAMPLE.host};S.cel={...EXAMPLE.cel}}
  S.fromLink=true;S.guestDraft={name:"",photo:null,k:null,msg:""};S.screen="g-view";
}
render();
</script>

</body>
</html>
